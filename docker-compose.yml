services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telonyx_autoedit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8080
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./storage:/data/storage
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: python -m worker.run_worker
    env_file: .env
    volumes:
      - ./storage:/data/storage
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
