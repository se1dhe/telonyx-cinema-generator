services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telonyx-cinema-finalizer
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      PYTHONPATH: /app/src
      STORAGE_DIR: /data/storage
      MAX_UPLOAD_MB: 1200
      ENABLE_WHISPER: "true"
      WHISPER_MODEL: small
      MODEL_DEVICE: cpu
      COMPUTE_TYPE: int8
    volumes:
      - storage-data:/data/storage

volumes:
  storage-data:
